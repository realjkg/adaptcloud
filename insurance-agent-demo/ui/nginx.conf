worker_processes 1;
events { worker_connections 512; }
http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — /triage etc. are always served from the built UI shell.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
