version: '3.9'

# ── AIDigest — secure deployment ──────────────────────────────────────────────
#
# Caddy terminates TLS on 443 and is the only way in. AIDigest is reachable only
# through Caddy at /aidigest/* (basic auth + proxy shared secret).
#
# Settings (in .env or the shell, never hardcoded here; "make setup" writes them):
#   ANTHROPIC_API_KEY         Claude API key
#   AIDIGEST_DATABASE_URL     least-privilege role that owns schema "aidigest"
#   AIDIGEST_PROXY_SECRET     Caddy -> AIDigest shared secret (openssl rand -hex 32)
#   AIDIGEST_BASIC_AUTH_USER  Basic-auth user for https://<host>/aidigest/*
#   AIDIGEST_BASIC_AUTH_HASH  bcrypt hash of that user's password (caddy hash-password)
# AIDigest runs under the "aidigest" profile: COMPOSE_PROFILES=aidigest in .env
# (setup.sh adds it) or "make aidigest-start".
# Missing or partial values fail closed without breaking Caddy: Caddy falls back to
# sentinel credentials and answers /aidigest/* with 401; the aidigest container refuses to
# start (PRODUCTION=true validation).
#
# Storage model:
#   All persistent data lives in the managed PostgreSQL database. The AIDigest
#   container is stateless: no local volumes and no writable filesystem except /tmp.

services:
  # AIDigest — AI intelligence service (AIDigest/). Opt-in profile; reachable only
  # through Caddy at /aidigest/* (basic auth + proxy shared secret). Compose evaluates
  # ":?" even for inactive profiles, so the values default to empty here and the
  # service itself refuses to start without them (fail closed).
  aidigest:
    profiles: ["aidigest"]
    build:
      context: ./AIDigest
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AIDIGEST_DATABASE_URL=${AIDIGEST_DATABASE_URL:-}
      - AIDIGEST_PROXY_SECRET=${AIDIGEST_PROXY_SECRET:-}
      - AIDIGEST_BASIC_AUTH_USER=${AIDIGEST_BASIC_AUTH_USER:-}   # validated only (Caddy authenticates)
      - AIDIGEST_MODEL=${AIDIGEST_MODEL:-claude-sonnet-5-5}
      - AIDIGEST_DAILY_TIME=${AIDIGEST_DAILY_TIME:-12:30}
      - PRODUCTION=true
    read_only: true                    # stateless container — all state in Postgres
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # TLS termination over HTTPS (port 443). Run "make caddy-trust" once per
  # device to install the local root CA so there are no certificate warnings.
  caddy:
    image: caddy:2-alpine
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    # Sanitises the AIDigest values first so Caddy always starts (see caddy-entrypoint.sh).
    command: ["/bin/sh", "/usr/local/bin/caddy-entrypoint.sh"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-entrypoint.sh:/usr/local/bin/caddy-entrypoint.sh:ro
      - caddy_data:/data
    # Plain values (may be empty or malformed): caddy-entrypoint.sh (the "command" below)
    # replaces anything Caddy could not load with the "not configured" sentinels, and the
    # Caddyfile guard then answers /aidigest/* with 401.
    environment:
      - AIDIGEST_BASIC_AUTH_USER=${AIDIGEST_BASIC_AUTH_USER:-}
      - AIDIGEST_BASIC_AUTH_HASH=${AIDIGEST_BASIC_AUTH_HASH:-}
      - AIDIGEST_PROXY_SECRET=${AIDIGEST_PROXY_SECRET:-}
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:     # persists Caddy's local CA and issued certs across restarts

networks:
  internal:
    driver: bridge
    internal: false    # aidigest needs outbound access for the Claude API and the managed DB
