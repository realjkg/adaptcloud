apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      residency.adaptcloud.io/environment: prod
patches:
  - target:
      kind: Deployment
      name: applied-ai-workload
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
