name = "adaptcloud-ai-digest"
main = "src/index.ts"
compatibility_date = "2026-09-30"

[ai]
binding = "AI"

# Wrangler >=4.45 auto-provisions and links D1 when no resource ID is present.
[[d1_databases]]
binding = "DB"

[triggers]
# Cron is UTC. 12:30 UTC is 7:30 AM CDT / 6:30 AM CST.
crons = ["30 12 * * *"]
