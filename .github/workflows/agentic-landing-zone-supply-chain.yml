name: Agentic Landing Zone Supply Chain

on:
  pull_request:
    paths:
      - "agentic-landing-zone/**"
      - ".github/workflows/agentic-landing-zone-supply-chain.yml"
      - ".github/dependabot.yml"
  push:
    paths:
      - "agentic-landing-zone/**"
      - ".github/workflows/agentic-landing-zone-supply-chain.yml"
      - ".github/dependabot.yml"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Verify, SBOM and security scan
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: agentic-landing-zone

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agentic-landing-zone/package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Type and regression checks
        run: |
          npm run check
          npm test
          npm run plugins:check

      - name: Operator design scenario smoke tests
        run: |
          ./alz design aws terraform brownfield
          ./alz design azure pulumi greenfield
          ./alz design aws opentofu brownfield
          ./alz design azure bicep brownfield
          ./alz design aws cloudformation brownfield
          ./alz design aws cdk brownfield
          ./alz design aws crossplane brownfield
          ./alz design aws ansible brownfield

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --package-lock-only > sbom.cdx.json

      - name: Filesystem vulnerability and IaC misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: agentic-landing-zone
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: agentic-landing-zone/trivy-results.json
          exit-code: "1"

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agentic-landing-zone-supply-chain
          path: |
            agentic-landing-zone/sbom.cdx.json
            agentic-landing-zone/trivy-results.json
          retention-days: 30
