name: Validate CCAR-P D1 Solution Design audit

on:
  pull_request:
    paths:
      - "ccar-f/certifications.js"
      - "ccar-f/ccar-p.bank-architecture.js"
      - "ccar-f/ccar-p.d1-reconcile.js"
      - "ccar-f/adaptive-core.js"
      - "ccar-f/audits/ccar-p-d1.json"
      - "ccar-f/audits/ccar-p-d1-reconciliation.json"
      - "ccar-f/index.html"
      - ".github/workflows/ccar-p-d1-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check D1 reconciliation syntax and wiring
        run: |
          node --check ccar-f/ccar-p.d1-reconcile.js
          node --check ccar-f/adaptive-core.js
          grep -q 'ccar-p.d1-reconcile.js' ccar-f/index.html
      - name: Validate D1 traceability, semantic families, and architecture boundaries
        run: |
          node <<'NODE'
          const fs=require('fs');
          const adaptive=require('./ccar-f/adaptive-core.js');
          global.window={};
          require('./ccar-f/certifications.js');
          require('./ccar-f/ccar-p.bank-architecture.js');
          require('./ccar-f/ccar-p.bank-enterprise.js');
          require('./ccar-f/ccar-p.d1-reconcile.js');
          const m=JSON.parse(fs.readFileSync('./ccar-f/audits/ccar-p-d1.json','utf8'));
          const r=JSON.parse(fs.readFileSync('./ccar-f/audits/ccar-p-d1-reconciliation.json','utf8'));
          const p=window.CLAUDE_CERTIFICATIONS['ccar-p'];
          const b=window.CLAUDE_CERT_BANK_EXPANSIONS['ccar-p'];
          const d=p.domains[m.internalDomain];
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          assert(d&&d.weight===m.weight&&d.mock===m.mockQuestions,'D1 profile geometry mismatch');
          assert(m.verificationStatus==='verified-against-exam-guide-v1.0'&&!(m.requiredRemediation||[]).length,'D1 audit is not closed');
          const objectiveIds=new Set(m.objectives.map(x=>x.id));
          assert(objectiveIds.size===m.objectiveCount,'D1 objective count mismatch');
          const cards=b.cards.filter(x=>x.domain===m.internalDomain), qs=b.questions.filter(x=>x.domain===m.internalDomain);
          assert(cards.length>=m.mockQuestions&&qs.length>=m.mockQuestions*2,`D1 insufficient bank depth: ${cards.length} cards / ${qs.length} questions`);
          const used=new Set();
          for(const c of cards){const x=c.id.match(/^P-(P\d+-\d+)-C$/)?.[1];assert(x&&m.conceptToObjective[x],`Unmapped D1 card ${c.id}`);used.add(m.conceptToObjective[x]);}
          for(const q of qs){const x=q.id.match(/^P-(P\d+-\d+)-[AB]$/)?.[1];assert(x&&m.conceptToObjective[x],`Unmapped D1 question ${q.id}`);assert(Array.isArray(q.choices)&&q.choices.length===4&&q.why,`Malformed D1 question ${q.id}`);}
          for(const id of objectiveIds) assert(used.has(id),`D1 objective not covered: ${id}`);
          assert(new Set(qs.map(q=>q.id)).size===qs.length,'Duplicate D1 question IDs');

          const recon=window.CLAUDE_CERT_RECONCILIATIONS?.['ccar-p-d1'];
          assert(recon&&recon.version===r.runtimeVersion,'D1 reconciliation runtime metadata missing');
          assert(qs.length===r.questionCount,`D1 expected ${r.questionCount} questions, found ${qs.length}`);
          assert(recon.canonicalFamilyCount===r.canonicalFamilyCount,`Expected ${r.canonicalFamilyCount} D1 families, found ${recon.canonicalFamilyCount}`);
          for(const q of qs){
            assert(q.semanticReconciliation?.version===r.runtimeVersion,`${q.id}: missing semantic reconciliation metadata`);
            assert(q.semanticReconciliation?.responsibilityBoundary==='solution-architecture-decision',`${q.id}: architecture responsibility boundary missing`);
            assert(q.familyId===q.semanticReconciliation.canonicalFamilyId,`${q.id}: canonical family mismatch`);
          }
          const familyCounts=new Map();
          for(const q of qs) familyCounts.set(q.familyId,(familyCounts.get(q.familyId)||0)+1);
          assert(familyCounts.size===11,'D1 must retain eleven distinct architecture competencies');
          for(const [family,n] of familyCounts) assert(n===2,`${family}: expected exactly two spaced variants, found ${n}`);
          const byId=Object.fromEntries(qs.map(q=>[q.id,q]));
          assert(byId['P-P2-08-A'].familyId!==byId['P-P2-09-A'].familyId,'Cost architecture and SLA engineering must remain distinct');
          assert(byId['P-P2-02-A'].familyId!==byId['P-P2-11-A'].familyId,'Business traceability and ADRs must remain distinct');
          assert(byId['P-P2-03-A'].familyId!==byId['P-P2-04-A'].familyId,'Decomposition and multi-agent orchestration must remain distinct');

          const mockIds=adaptive.mockSet({questions:qs,profileCode:'CCAR-P',qProgress:{},domains:{P2:{mock:11,weight:17}},rng:()=>0.314159});
          assert(mockIds.length===11,'D1 mock must contain 11 questions');
          assert(new Set(mockIds.map(id=>byId[id].familyId)).size===11,'D1 mock repeated an architecture semantic family');
          const practiceIds=adaptive.practiceSet({questions:qs,profileCode:'CCAR-P',qProgress:{},recentConcepts:[],n:11,rng:()=>0.271828});
          assert(practiceIds.length===11,'D1 practice should expose all eleven semantic families before repetition');
          assert(new Set(practiceIds.map(id=>byId[id].familyId)).size===11,'D1 practice repeated a semantic family before breadth was exhausted');

          const html=fs.readFileSync('./ccar-f/index.html','utf8');
          const bankAt=html.indexOf('./ccar-p.bank-architecture.js');
          const reconAt=html.indexOf('./ccar-p.d1-reconcile.js');
          const loaderAt=html.indexOf('./loader.js');
          assert(reconAt>bankAt&&loaderAt>reconAt,'D1 reconciliation load order is invalid');
          console.log(`D1 validated: ${m.objectiveCount} objectives, ${cards.length} cards, ${qs.length} questions, ${recon.canonicalFamilyCount} semantic families.`);
          NODE
