name: Validate CCAR-P D1 Solution Design audit

on:
  pull_request:
    paths:
      - "ccar-f/certifications.js"
      - "ccar-f/ccar-p.bank-architecture.js"
      - "ccar-f/ccar-p.d1-scenario-rewrite.js"
      - "ccar-f/ccar-p.d1-reconcile.js"
      - "ccar-f/adaptive-core.js"
      - "ccar-f/audits/ccar-p-d1.json"
      - "ccar-f/audits/ccar-p-d1-reconciliation.json"
      - "ccar-f/index.html"
      - ".github/workflows/ccar-p-d1-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check D1 rewrite and reconciliation syntax
        run: |
          node --check ccar-f/ccar-p.d1-scenario-rewrite.js
          node --check ccar-f/ccar-p.d1-reconcile.js
          node --check ccar-f/adaptive-core.js
      - name: Validate D1 traceability, scenario diversity, semantic families, and architecture boundaries
        run: |
          node <<'NODE'
          const fs=require('fs');
          const adaptive=require('./ccar-f/adaptive-core.js');
          global.window={};
          require('./ccar-f/certifications.js');
          require('./ccar-f/ccar-p.bank-architecture.js');
          require('./ccar-f/ccar-p.bank-enterprise.js');
          require('./ccar-f/ccar-p.d1-scenario-rewrite.js');
          require('./ccar-f/ccar-p.d1-reconcile.js');
          const m=JSON.parse(fs.readFileSync('./ccar-f/audits/ccar-p-d1.json','utf8'));
          const r=JSON.parse(fs.readFileSync('./ccar-f/audits/ccar-p-d1-reconciliation.json','utf8'));
          const p=window.CLAUDE_CERTIFICATIONS['ccar-p'];
          const b=window.CLAUDE_CERT_BANK_EXPANSIONS['ccar-p'];
          const d=p.domains[m.internalDomain];
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          assert(d&&d.weight===m.weight&&d.mock===m.mockQuestions,'D1 profile geometry mismatch');
          const cards=b.cards.filter(x=>x.domain===m.internalDomain),qs=b.questions.filter(x=>x.domain===m.internalDomain);
          assert(cards.length>=m.mockQuestions&&qs.length===22,`D1 bank geometry unexpected: ${cards.length}/${qs.length}`);
          const objectiveIds=new Set(m.objectives.map(x=>x.id)),used=new Set();
          for(const c of cards){const x=c.id.match(/^P-(P\d+-\d+)-C$/)?.[1];assert(x&&m.conceptToObjective[x],`Unmapped D1 card ${c.id}`);used.add(m.conceptToObjective[x]);}
          for(const id of objectiveIds)assert(used.has(id),`D1 objective not covered: ${id}`);
          assert(new Set(qs.map(q=>q.id)).size===qs.length,'Duplicate D1 question IDs');
          const recon=window.CLAUDE_CERT_RECONCILIATIONS?.['ccar-p-d1'];
          assert(recon&&recon.canonicalFamilyCount===11&&recon.version===r.runtimeVersion,'D1 reconciliation metadata mismatch');
          for(const q of qs){assert(q.familyId===q.semanticReconciliation?.canonicalFamilyId,`${q.id}: family mismatch`);assert(q.semanticReconciliation?.responsibilityBoundary==='solution-architecture-decision',`${q.id}: boundary missing`);}
          const byId=Object.fromEntries(qs.map(q=>[q.id,q]));
          const familyCounts=new Map();for(const q of qs)familyCounts.set(q.familyId,(familyCounts.get(q.familyId)||0)+1);
          assert(familyCounts.size===11&&[...familyCounts.values()].every(n=>n===2),'D1 must retain eleven two-variant families');
          const rewrite=window.CLAUDE_CERT_SCENARIO_REWRITES?.['ccar-p-d1'];
          assert(rewrite?.version==='2026-09-15-d1-scenarios-v1'&&rewrite.rewrittenQuestionIds.length===11,'D1 rewrite metadata mismatch');
          const words=s=>new Set(String(s).toLowerCase().match(/[a-z0-9]+/g)?.filter(w=>w.length>3)||[]);
          const jac=(a,b)=>{const A=words(a),B=words(b);let i=0;for(const w of A)if(B.has(w))i++;return i/(new Set([...A,...B]).size||1)};
          for(const id of rewrite.rewrittenQuestionIds){const qb=byId[id],qa=byId[id.replace(/-B$/,'-A')];assert(qb&&qa,`${id}: pair missing`);assert(qb.scenarioRewrite?.version===rewrite.version,`${id}: metadata missing`);assert(Array.isArray(qb.choiceWhy)&&qb.choiceWhy.length===4,`${id}: choice rationales missing`);assert(qb.why?.length>=100,`${id}: explanation thin`);assert(!/^During a production design review,/i.test(qb.q),`${id}: generic wrapper remains`);assert(jac(qa.q,qb.q)<0.55,`${id}: scenario too close to A`);}
          const mock=adaptive.mockSet({questions:qs,profileCode:'CCAR-P',qProgress:{},domains:{P2:{mock:11,weight:17}},rng:()=>0.314159});
          assert(mock.length===11&&new Set(mock.map(id=>byId[id].familyId)).size===11,'D1 mock repeated a family');
          const html=fs.readFileSync('./ccar-f/index.html','utf8');
          const bankAt=html.indexOf('./ccar-p.bank-architecture.js'),rewriteAt=html.indexOf('./ccar-p.d1-scenario-rewrite.js'),reconAt=html.indexOf('./ccar-p.d1-reconcile.js'),loaderAt=html.indexOf('./loader.js');
          assert(rewriteAt>bankAt&&reconAt>rewriteAt&&loaderAt>reconAt,'D1 load order invalid');
          console.log(`D1 validated: ${cards.length} cards, ${qs.length} questions, ${rewrite.rewrittenQuestionIds.length} rewrites, ${recon.canonicalFamilyCount} families.`);
          NODE
