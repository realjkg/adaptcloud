name: Validate CCAR-P D7 Developer Productivity audit

on:
  pull_request:
    paths:
      - "ccar-f/certifications.js"
      - "ccar-f/ccar-p.bank-enterprise.js"
      - "ccar-f/ccar-p.d7-scenario-rewrite.js"
      - "ccar-f/adaptive-core.js"
      - "ccar-f/audits/ccar-p-d7.json"
      - "ccar-f/index.html"
      - ".github/workflows/ccar-p-d7-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check D7 rewrite syntax and wiring
        run: |
          node --check ccar-f/ccar-p.d7-scenario-rewrite.js
          node --check ccar-f/adaptive-core.js
      - name: Validate D7 traceability, scenario diversity, family preservation, and bank depth
        run: |
          node <<'NODE'
          const fs=require('fs');
          const adaptive=require('./ccar-f/adaptive-core.js');
          global.window={};
          require('./ccar-f/certifications.js');
          require('./ccar-f/ccar-p.bank-architecture.js');
          require('./ccar-f/ccar-p.bank-enterprise.js');
          require('./ccar-f/ccar-p.d7-scenario-rewrite.js');
          const m=JSON.parse(fs.readFileSync('./ccar-f/audits/ccar-p-d7.json','utf8'));
          const p=window.CLAUDE_CERTIFICATIONS['ccar-p'];
          const b=window.CLAUDE_CERT_BANK_EXPANSIONS['ccar-p'];
          const d=p.domains[m.internalDomain];
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          assert(d&&d.weight===m.weight&&d.mock===m.mockQuestions,'D7 profile geometry mismatch');
          assert(m.verificationStatus==='verified-against-exam-guide-v1.0'&&!(m.requiredRemediation||[]).length,'D7 audit is not closed');
          const objectiveIds=new Set(m.objectives.map(x=>x.id));
          assert(objectiveIds.size===m.objectiveCount,'D7 objective count mismatch');
          const cards=b.cards.filter(x=>x.domain===m.internalDomain),qs=b.questions.filter(x=>x.domain===m.internalDomain);
          assert(cards.length===4&&qs.length===8,`D7 bank geometry unexpected: ${cards.length}/${qs.length}`);
          const used=new Set();
          for(const c of cards){const x=c.id.match(/^P-(P\d+-\d+)-C$/)?.[1];assert(x&&m.conceptToObjective[x],`Unmapped D7 card ${c.id}`);used.add(m.conceptToObjective[x]);}
          for(const q of qs){const x=q.id.match(/^P-(P\d+-\d+)-[AB]$/)?.[1];assert(x&&m.conceptToObjective[x],`Unmapped D7 question ${q.id}`);assert(Array.isArray(q.choices)&&q.choices.length===4&&q.why,`Malformed D7 question ${q.id}`);}
          for(const id of objectiveIds)assert(used.has(id),`D7 objective not covered: ${id}`);
          assert(new Set(qs.map(q=>q.id)).size===qs.length,'Duplicate D7 question IDs');

          const byId=Object.fromEntries(qs.map(q=>[q.id,q]));
          const familyKeys=new Set(qs.map(q=>adaptive.conceptKey(q,'CCAR-P')));
          assert(familyKeys.size===4,'D7 must retain four canonical concept families');
          for(let i=1;i<=4;i++){
            const n=String(i).padStart(2,'0'),qa=byId[`P-P7-${n}-A`],qb=byId[`P-P7-${n}-B`];
            assert(qa&&qb,`P7-${n}: pair missing`);
            assert(adaptive.conceptKey(qa,'CCAR-P')===adaptive.conceptKey(qb,'CCAR-P'),`P7-${n}: canonical family mapping changed`);
          }

          const rewrite=window.CLAUDE_CERT_SCENARIO_REWRITES?.['ccar-p-d7'];
          assert(rewrite?.version==='2026-09-15-d7-scenarios-v1'&&rewrite.rewrittenQuestionIds.length===4,'D7 rewrite metadata mismatch');
          const words=s=>new Set(String(s).toLowerCase().match(/[a-z0-9]+/g)?.filter(w=>w.length>3)||[]);
          const jac=(a,b)=>{const A=words(a),B=words(b);let i=0;for(const w of A)if(B.has(w))i++;return i/(new Set([...A,...B]).size||1)};
          for(const id of rewrite.rewrittenQuestionIds){
            const qb=byId[id],qa=byId[id.replace(/-B$/,'-A')];
            assert(qb&&qa,`${id}: pair missing`);
            assert(qb.scenarioRewrite?.version===rewrite.version,`${id}: rewrite metadata missing`);
            assert(Array.isArray(qb.choices)&&qb.choices.length===4,`${id}: four choices required`);
            assert(new Set(qb.choices.map(x=>String(x).trim().toLowerCase())).size===4,`${id}: duplicate choice text`);
            assert(Array.isArray(qb.choiceWhy)&&qb.choiceWhy.length===4&&qb.choiceWhy.every(x=>String(x).trim().length>=35),`${id}: choice rationales missing or thin`);
            assert(qb.why?.length>=100,`${id}: explanation thin`);
            assert(!/^During a production design review,/i.test(qb.q),`${id}: generic wrapper remains`);
            assert(jac(qa.q,qb.q)<0.55,`${id}: scenario too close to A`);
          }

          const mockIds=adaptive.mockSet({questions:qs,profileCode:'CCAR-P',qProgress:{},domains:{P7:{mock:m.mockQuestions,weight:m.weight}},rng:()=>0.314159});
          assert(mockIds.length===4&&new Set(mockIds.map(id=>adaptive.conceptKey(byId[id],'CCAR-P'))).size===4,'D7 mock repeated a canonical family');
          const practiceIds=adaptive.practiceSet({questions:qs,profileCode:'CCAR-P',qProgress:{},recentConcepts:[],n:4,rng:()=>0.271828});
          assert(practiceIds.length===4&&new Set(practiceIds.map(id=>adaptive.conceptKey(byId[id],'CCAR-P'))).size===4,'D7 practice repeated a family before breadth was exhausted');

          const html=fs.readFileSync('./ccar-f/index.html','utf8');
          const bankAt=html.indexOf('./ccar-p.bank-enterprise.js'),rewriteAt=html.indexOf('./ccar-p.d7-scenario-rewrite.js'),loaderAt=html.indexOf('./loader.js');
          assert(rewriteAt>bankAt&&loaderAt>rewriteAt,'D7 load order invalid');
          console.log(`D7 validated: ${m.objectiveCount} objectives, ${cards.length} cards, ${qs.length} questions, ${rewrite.rewrittenQuestionIds.length} rewrites, ${familyKeys.size} families.`);
          NODE
