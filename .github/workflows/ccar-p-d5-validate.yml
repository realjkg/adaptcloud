name: Validate CCAR-P D5 Governance Safety Risk audit

on:
  pull_request:
    paths:
      - "ccar-f/certifications.js"
      - "ccar-f/ccar-p.bank-enterprise.js"
      - "ccar-f/ccar-p.d5-topup.js"
      - "ccar-f/ccar-p.d5-scenario-rewrite.js"
      - "ccar-f/adaptive-core.js"
      - "ccar-f/audits/ccar-p-d5.json"
      - "ccar-f/index.html"
      - ".github/workflows/ccar-p-d5-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check D5 rewrite syntax and wiring
        run: |
          node --check ccar-f/ccar-p.d5-topup.js
          node --check ccar-f/ccar-p.d5-scenario-rewrite.js
          node --check ccar-f/adaptive-core.js
      - name: Validate D5 traceability, scenario diversity, family preservation, and bank depth
        run: |
          node <<'NODE'
          const fs=require('fs');
          const adaptive=require('./ccar-f/adaptive-core.js');
          global.window={};
          require('./ccar-f/certifications.js');
          require('./ccar-f/ccar-p.bank-architecture.js');
          require('./ccar-f/ccar-p.bank-enterprise.js');
          require('./ccar-f/ccar-p.d5-topup.js');
          require('./ccar-f/ccar-p.d5-scenario-rewrite.js');
          const m=JSON.parse(fs.readFileSync('./ccar-f/audits/ccar-p-d5.json','utf8'));
          const p=window.CLAUDE_CERTIFICATIONS['ccar-p'];
          const b=window.CLAUDE_CERT_BANK_EXPANSIONS['ccar-p'];
          const d=p.domains[m.internalDomain];
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          assert(d&&d.weight===m.weight&&d.mock===m.mockQuestions,'D5 profile geometry mismatch');
          assert(m.verificationStatus==='verified-against-exam-guide-v1.0'&&!(m.requiredRemediation||[]).length,'D5 audit is not closed');
          const objectiveIds=new Set(m.objectives.map(x=>x.id));
          assert(objectiveIds.size===m.objectiveCount,'D5 objective count mismatch');
          const cards=b.cards.filter(x=>x.domain===m.internalDomain),qs=b.questions.filter(x=>x.domain===m.internalDomain);
          assert(cards.length===10&&qs.length===20,`D5 bank geometry unexpected: ${cards.length}/${qs.length}`);
          const used=new Set();
          for(const c of cards){const x=c.id.match(/^P-(P\d+-\d+)-C$/)?.[1];assert(x&&m.conceptToObjective[x],`Unmapped D5 card ${c.id}`);used.add(m.conceptToObjective[x]);}
          for(const q of qs){const x=q.id.match(/^P-(P\d+-\d+)-[AB]$/)?.[1];assert(x&&m.conceptToObjective[x],`Unmapped D5 question ${q.id}`);assert(Array.isArray(q.choices)&&q.choices.length===4&&q.why,`Malformed D5 question ${q.id}`);}
          for(const id of objectiveIds)assert(used.has(id),`D5 objective not covered: ${id}`);
          assert(used.has('D5.5'),'D5.5 remediation missing');
          assert(new Set(qs.map(q=>q.id)).size===qs.length,'Duplicate D5 question IDs');

          const byId=Object.fromEntries(qs.map(q=>[q.id,q]));
          const familyKeys=new Set(qs.map(q=>adaptive.conceptKey(q,'CCAR-P')));
          assert(familyKeys.size===10,'D5 must retain ten canonical concept families');
          for(let i=1;i<=10;i++){
            const n=String(i).padStart(2,'0'),qa=byId[`P-P4-${n}-A`],qb=byId[`P-P4-${n}-B`];
            assert(qa&&qb,`P4-${n}: pair missing`);
            assert(adaptive.conceptKey(qa,'CCAR-P')===adaptive.conceptKey(qb,'CCAR-P'),`P4-${n}: canonical family mapping changed`);
          }

          const rewrite=window.CLAUDE_CERT_SCENARIO_REWRITES?.['ccar-p-d5'];
          assert(rewrite?.version==='2026-09-15-d5-scenarios-v1'&&rewrite.rewrittenQuestionIds.length===10,'D5 rewrite metadata mismatch');
          const words=s=>new Set(String(s).toLowerCase().match(/[a-z0-9]+/g)?.filter(w=>w.length>3)||[]);
          const jac=(a,b)=>{const A=words(a),B=words(b);let i=0;for(const w of A)if(B.has(w))i++;return i/(new Set([...A,...B]).size||1)};
          for(const id of rewrite.rewrittenQuestionIds){
            const qb=byId[id],qa=byId[id.replace(/-B$/,'-A')];
            assert(qb&&qa,`${id}: pair missing`);
            assert(qb.scenarioRewrite?.version===rewrite.version,`${id}: rewrite metadata missing`);
            assert(Array.isArray(qb.choices)&&qb.choices.length===4,`${id}: four choices required`);
            assert(new Set(qb.choices.map(x=>String(x).trim().toLowerCase())).size===4,`${id}: duplicate choice text`);
            assert(Array.isArray(qb.choiceWhy)&&qb.choiceWhy.length===4&&qb.choiceWhy.every(x=>String(x).trim().length>=35),`${id}: choice rationales missing or thin`);
            assert(qb.why?.length>=100,`${id}: explanation thin`);
            assert(!/^During a production design review,/i.test(qb.q),`${id}: generic wrapper remains`);
            assert(jac(qa.q,qb.q)<0.55,`${id}: scenario too close to A`);
          }

          const mockIds=adaptive.mockSet({questions:qs,profileCode:'CCAR-P',qProgress:{},domains:{P4:{mock:m.mockQuestions,weight:m.weight}},rng:()=>0.314159});
          assert(mockIds.length===m.mockQuestions,'D5 mock geometry mismatch');
          assert(new Set(mockIds.map(id=>adaptive.conceptKey(byId[id],'CCAR-P'))).size===mockIds.length,'D5 mock repeated a canonical family');
          const practiceIds=adaptive.practiceSet({questions:qs,profileCode:'CCAR-P',qProgress:{},recentConcepts:[],n:10,rng:()=>0.271828});
          assert(practiceIds.length===10&&new Set(practiceIds.map(id=>adaptive.conceptKey(byId[id],'CCAR-P'))).size===10,'D5 practice repeated a family before breadth was exhausted');

          const html=fs.readFileSync('./ccar-f/index.html','utf8');
          const bankAt=html.indexOf('./ccar-p.bank-enterprise.js'),topupAt=html.indexOf('./ccar-p.d5-topup.js'),rewriteAt=html.indexOf('./ccar-p.d5-scenario-rewrite.js'),loaderAt=html.indexOf('./loader.js');
          assert(topupAt>bankAt&&rewriteAt>topupAt&&loaderAt>rewriteAt,'D5 load order invalid');
          console.log(`D5 validated: ${m.objectiveCount} objectives, ${cards.length} cards, ${qs.length} questions, ${rewrite.rewrittenQuestionIds.length} rewrites, ${familyKeys.size} families.`);
          NODE
