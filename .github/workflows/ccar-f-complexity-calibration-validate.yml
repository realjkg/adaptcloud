name: CCAR-F complexity calibration
on:
  pull_request:
    paths:
      - 'ccar-f/ccar-f-foundations-complexity.js'
      - 'ccar-f/loader.js'
      - '.github/workflows/ccar-f-complexity-calibration-validate.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and calibration contract
        run: |
          node --check ccar-f/ccar-f-foundations-complexity.js
          node --check ccar-f/loader.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('ccar-f/ccar-f-foundations-complexity.js','utf8');
          const ctx={window:{CERT_TRACK:'ccar-f',CCARF_QUESTIONS:[]}};
          vm.createContext(ctx);vm.runInContext(code,ctx);
          const q=ctx.window.CCARF_QUESTIONS;
          if(q.length!==20)throw Error(`expected 20 calibrated questions, got ${q.length}`);
          for(const d of ['D1','D2','D3','D4','D5']){
            const n=q.filter(x=>x.domain===d).length;
            if(n!==4)throw Error(`${d}: expected 4, got ${n}`);
          }
          for(const x of q){
            if(x.choices.length!==4)throw Error(`${x.id}: not four choices`);
            if(!Number.isInteger(x.answer)||x.answer<0||x.answer>3)throw Error(`${x.id}: invalid answer`);
            if(!x.why||x.why.length<40)throw Error(`${x.id}: weak rationale`);
            if(x.difficulty!=='calibrated-hard')throw Error(`${x.id}: missing difficulty tag`);
            if(x.provenance!=='project-original-structure-calibrated')throw Error(`${x.id}: missing provenance`);
          }
          const positions=[0,0,0,0];q.forEach(x=>positions[x.answer]++);
          if(positions.some(n=>n<2))throw Error(`answer-position imbalance: ${positions}`);
          if(!ctx.window.CCARF_COMPLEXITY_CALIBRATION||ctx.window.CCARF_COMPLEXITY_CALIBRATION.thirdPartyTextCopied!==false)throw Error('provenance boundary missing');
          const loader=fs.readFileSync('ccar-f/loader.js','utf8');
          const cx=loader.indexOf('ccar-f-foundations-complexity.js'), fidelity=loader.indexOf('foundations-scenario-fidelity.js');
          if(cx<0||fidelity<0||cx>fidelity)throw Error('complexity layer must load before scenario fidelity');
          console.log('CCAR-F complexity calibration OK', {count:q.length,positions});
          NODE