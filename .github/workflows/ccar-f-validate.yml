name: Validate Claude certification simulator

on:
  pull_request:
    paths:
      - "ccar-f/**"
      - ".github/workflows/ccar-f-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check ccar-f/app.js
          node --check ccar-f/exam.js
          node --check ccar-f/loader.js
          node --check ccar-f/certifications.js
          node --check ccar-f/ccao-f.seed.js
          node --check ccar-f/ccao-f.bank.js
          node --check ccar-f/ccdv-f.seed.js
          node --check ccar-f/ccdv-f.bank-core.js
          node --check ccar-f/ccdv-f.bank-tools.js
          node --check ccar-f/ccar-f.bank.js
          node --check ccar-f/ccar-f.bank-topup.js
          node --check ccar-f/multi-app.js
          for f in ccar-f/payload*.js; do node --check "$f"; done

      - name: Validate all Foundations banks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          global.window = {};
          require('./ccar-f/certifications.js');
          require('./ccar-f/ccao-f.seed.js');
          require('./ccar-f/ccdv-f.seed.js');
          require('./ccar-f/ccao-f.bank.js');
          require('./ccar-f/ccdv-f.bank-core.js');
          require('./ccar-f/ccdv-f.bank-tools.js');
          require('./ccar-f/ccar-f.bank.js');
          require('./ccar-f/ccar-f.bank-topup.js');

          const certs = window.CLAUDE_CERTIFICATIONS;
          const seed = window.CLAUDE_CERT_SEED_DATA || {};
          const expansion = window.CLAUDE_CERT_BANK_EXPANSIONS || {};

          for (const code of ['ccao-f','ccdv-f','ccar-f','ccar-p']) {
            if (!certs[code]) throw new Error(`Missing certification profile ${code}`);
          }

          const files = [1,2,3,4,5].map(n => `ccar-f/payload${n}.js`);
          let b64 = '';
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            const m = text.match(/push\("([A-Za-z0-9+/=]+)"\);/);
            if (!m) throw new Error(`Unable to read payload from ${file}`);
            b64 += m[1];
          }
          const architectBase = JSON.parse(zlib.gunzipSync(Buffer.from(b64, 'base64')));

          const merge = (a,b) => ({
            cards:[...(a?.cards||[]),...(b?.cards||[])],
            questions:[...(a?.questions||[]),...(b?.questions||[])]
          });
          const banks = {
            'ccao-f': merge(seed['ccao-f'], expansion['ccao-f']),
            'ccdv-f': merge(seed['ccdv-f'], expansion['ccdv-f']),
            'ccar-f': merge(architectBase, expansion['ccar-f'])
          };

          for (const code of ['ccao-f','ccdv-f','ccar-f']) {
            const p = certs[code], d = banks[code];
            if (p.bankStatus !== 'complete') throw new Error(`${code} bank must be marked complete after expansion`);
            if ((p.bankDepth||0) < 2) throw new Error(`${code} must declare bankDepth >= 2`);
            const totalMock = Object.values(p.domains).reduce((n,x)=>n+x.mock,0);
            if (totalMock !== p.questionCount) throw new Error(`${code} mock allocation totals ${totalMock}, expected ${p.questionCount}`);
            if (d.questions.length < p.questionCount * 2) throw new Error(`${code} needs at least ${p.questionCount*2} questions for two forms; got ${d.questions.length}`);
            if (!d.cards.length) throw new Error(`${code} has no flashcards`);
            if (d.cards.some(c => !c.example || !String(c.example).trim())) throw new Error(`${code} flashcard missing example`);
            if (d.cards.some(c => !p.domains[c.domain])) throw new Error(`${code} flashcard has invalid domain`);
            if (d.questions.some(q => !p.domains[q.domain])) throw new Error(`${code} question has invalid domain`);
            if (d.questions.some(q => !Array.isArray(q.choices) || q.choices.length !== 4 || !Number.isInteger(q.answer) || q.answer < 0 || q.answer > 3 || !q.why)) throw new Error(`${code} has malformed question content`);
            if (new Set(d.cards.map(c=>c.id)).size !== d.cards.length) throw new Error(`${code} duplicate card IDs`);
            if (new Set(d.questions.map(q=>q.id)).size !== d.questions.length) throw new Error(`${code} duplicate question IDs`);
            if (new Set(d.questions.map(q=>q.q)).size !== d.questions.length) throw new Error(`${code} duplicate question text`);
            for (const [domain,x] of Object.entries(p.domains)) {
              const available = d.questions.filter(q=>q.domain===domain).length;
              const required = x.mock * 2;
              if (available < required) throw new Error(`${code} ${domain} needs ${required} questions for two forms but has ${available}`);
            }
            console.log(`${code}: ${d.cards.length} cards, ${d.questions.length} questions, two-form depth validated.`);
          }

          const keys=['ccao-f','ccdv-f','ccar-f'].map(c=>certs[c].progressKey);
          if (new Set(keys).size !== keys.length) throw new Error('Certification progress keys must be isolated');
          console.log('All Foundations banks validated with isolated progress and two complete domain-weighted forms.');
          NODE

      - name: Verify static entry points and exam navigation
        run: |
          test -f ccar-f/index.html
          test -f ccar-f/styles.css
          test -f ccar-f/exam.css
          test -f ccar-f/exam.js
          test -f ccar-f/multi-app.js
          grep -q 'certifications.js' ccar-f/index.html
          grep -q 'ccao-f.seed.js' ccar-f/index.html
          grep -q 'ccao-f.bank.js' ccar-f/index.html
          grep -q 'ccdv-f.seed.js' ccar-f/index.html
          grep -q 'ccdv-f.bank-core.js' ccar-f/index.html
          grep -q 'ccdv-f.bank-tools.js' ccar-f/index.html
          grep -q 'ccar-f.bank.js' ccar-f/index.html
          grep -q 'ccar-f.bank-topup.js' ccar-f/index.html
          grep -q 'payload5.js' ccar-f/index.html
          grep -q 'loader.js' ccar-f/index.html
          grep -q 'multi-app.js' ccar-f/loader.js
          grep -q 'exam.js' ccar-f/loader.js
          grep -q 'Flag for Review' ccar-f/exam.js
          grep -q 'Review Incomplete' ccar-f/exam.js
          grep -q 'Review Flagged' ccar-f/exam.js
          grep -q 'End Review & Submit Exam' ccar-f/exam.js
